[build-system]
requires = [
    "meson-python>=0.16",
    "meson>=1.4",
    "ninja",
    "Cython>=3.0",
    "numpy>=2.0; python_version>='3.10'",
    # The _fast_s and _lmrob Cython modules cimport from
    # scipy.linalg.cython_lapack; scipy must be available at build time
    # for Cython to find the .pxd.
    "scipy>=1.11",
]
build-backend = "mesonpy"

[project]
name = "pylmrob"
description = "Python port of robustbase::lmrob (MM regression)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Vena", email = "vena.pablo@gmail.com" }]
requires-python = ">=3.10"
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "formulaic>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "pytest-xdist",
    "pytest-randomly",
    "pytest-rerunfailures",
    "hypothesis>=6.100",
    "ruff>=0.15,<0.16",
    "pre-commit>=3.7",
    "Cython>=3.0",
]
# Validation harness against R. Requires a local R install with the
# robustbase package, so it lives in its own optional group; CI installs
# this only on the Linux test job. Pin rpy2<3.6 because rpy2 3.6 needs
# R >= 4.4 (uses R_getVar).
validation = [
    "rpy2>=3.5,<3.7",
]
plot = [
    "matplotlib>=3.7",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme",
    "sphinx-autodoc-typehints",
    "myst-parser",
]

[project.urls]
Homepage = "https://github.com/anevolbap/pyrobustlm"
Source = "https://github.com/anevolbap/pyrobustlm"
Issues = "https://github.com/anevolbap/pyrobustlm/issues"
Changelog = "https://github.com/anevolbap/pyrobustlm/blob/main/CHANGELOG.md"

[tool.meson-python.args]
setup = ["--default-library=static"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                 # isort
    "B",                 # bugbear
    "UP",                # pyupgrade
    "N",                 # pep8-naming
    "SIM",               # simplify
    "RUF",
]
ignore = [
    "E501",              # line length: ruff format handles this
    "N806",              # we use mathematical names like X, beta, sigma
    "N803",              # same for arg names
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N"]
# Names mirrored from R's lmrob.control() and from the math literature
# (E[psi^2], E[D psi], etc.). We want to keep them for grep-ability.
"src/pylmrob/control.py" = ["N815"]
"src/pylmrob/psi.py" = ["N802"]
"src/pylmrob/_fast_s.py" = ["N815"]
# _psifuns.py: capitalised constants (R1, R2, ...) match the published
# polynomial coefficients in the optimal psi family.
"src/pylmrob/_psifuns.py" = ["N802", "N806", "RUF059"]
# _mm.py: ``it`` is the iteration counter; ruff thinks it's unused.
"src/pylmrob/_mm.py" = ["B007"]
"src/pylmrob/ms_estimator.py" = ["B007"]
"src/pylmrob/inference.py" = ["N806"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
include = ["src/pylmrob"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    # Coverage floor. 67% locally without rpy2; CI Linux clears more tests
    # so this leaves room while still catching real regressions.
    "--cov=pylmrob",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=65",
]
markers = [
    "slow: marks tests as slow",
    "rpy2: requires a working rpy2/R install",
    "rng_sensitive: result depends on RNG; tolerances are looser",
    "validation: cross-checks against R reference output",
]
# Make pytest-randomly's seed visible in the output so a failure can be
# reproduced with --randomly-seed=N.
randomly_dont_reset_seed = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = ["*-musllinux_*", "*-win32", "*-manylinux_i686"]
build-verbosity = 1
test-requires = [
    "pytest",
    "pytest-cov",
    "pytest-randomly",
    "pytest-rerunfailures",
    "numpy",
    "scipy",
    "pandas",
    "formulaic",
]
# cibuildwheel only runs tests/unit (a subset of the suite), so coverage
# isn't meaningful here. pytest-cov is installed because addopts in
# [tool.pytest.ini_options] reference --cov-* flags; --no-cov defangs
# the --cov-fail-under gate for the wheel-install smoke. Real coverage
# enforcement happens in the test job in ci.yml.
test-command = "pytest --no-cov {project}/tests/unit -x"

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]

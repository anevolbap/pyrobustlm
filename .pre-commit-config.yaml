repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Match the project's dev pin in pyproject.toml ("ruff>=0.15,<0.16").
    # Older ruff doesn't know the RUF059 selector used in
    # tool.ruff.lint.per-file-ignores.
    rev: v0.15.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # ty is run in CI via `uvx ty check`. Adding it here as a local hook so
  # it runs against the project venv (which has the compiled extension
  # available, unlike isolated pre-commit envs).
  - repo: local
    hooks:
      - id: ty
        name: ty (type check)
        entry: uvx ty check
        language: system
        pass_filenames: false
        files: ^src/pylmrob/.*\.py$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # meson.build's ``version: ...`` and src/pylmrob/_version.py's
  # ``__version__`` must agree, otherwise cibuildwheel produces wheels
  # named after the stale version and PyPI rejects the upload as
  # "File already exists" against the old wheel hash. v0.5.16 and v0.5.17
  # both failed this way.
  - repo: local
    hooks:
      - id: version-sync
        name: version sync (meson.build vs _version.py)
        entry: python scripts/check_version_sync.py
        language: system
        pass_filenames: false
        files: ^(meson\.build|src/pylmrob/_version\.py)$

  # Require an SPDX license header on every source file. Project is
  # GPL-3.0-or-later, matching LICENSE. The check runs against any
  # python / cython / R / pxd source under src, tests, scripts.
  - repo: local
    hooks:
      - id: spdx-header
        name: SPDX license header
        entry: python scripts/check_spdx_headers.py
        language: system
        pass_filenames: true
        files: ^(src/pylmrob/.*\.(py|pyx|pxd)|tests/.*\.py|scripts/.*\.(py|R))$

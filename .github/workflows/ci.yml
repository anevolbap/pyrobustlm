name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs of the same workflow on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project + lint deps
        # Install the project (so ty sees numpy/scipy/pandas/formulaic in
        # the same env) plus ruff and ty.
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]" ruff ty
      - name: Ruff
        run: ruff check src tests
      - name: Ruff format check
        run: ruff format --check src tests
      - name: ty (type check)
        # Astral's ty is the project's standard type checker (replaces mypy).
        run: ty check src/pylmrob

  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install pre-commit
        run: python -m pip install pre-commit
      - name: Run pre-commit
        # Skips the local ``ty`` hook because it shells out to ``uvx ty``
        # against the project venv; ty is already covered by the ``lint``
        # job above with the package's deps installed.
        env:
          SKIP: ty
        run: pre-commit run --all-files --show-diff-on-failure

  docs:
    name: Docs (Sphinx build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install build deps + project + docs extras
        # Same build-deps as the Read the Docs config in .readthedocs.yaml;
        # keeping the two in sync prevents the "RTD breaks on next tag"
        # failure mode we hit with the missing scipy pin in v0.5.17.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "meson-python>=0.16" "meson>=1.4" ninja \
            "Cython>=3" "numpy>=2" "scipy>=1.11"
          python -m pip install -e ".[docs]" --no-build-isolation
      - name: sphinx-build (fail on warnings, matching RTD)
        run: sphinx-build -W -b html docs docs/_build

  wheel-smoke:
    name: Wheel install smoke (cibuildwheel test-command) ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Runs on all three OSes because cibuildwheel does not use the same
    # shell everywhere: sh -c on Linux and macOS, cmd on Windows. A
    # test-command that parses under one can fail under the other, which
    # is how v0.5.30 died (single-quoted -m marker, fine under sh, split
    # into two arguments by cmd).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: macos-latest
            shell: bash
          - os: windows-latest
            shell: cmd
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Build a wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist/
      - name: Install the wheel (not editable, no source tree on sys.path)
        # --no-index --find-links instead of a dist/*.whl glob: cmd does
        # not expand globs.
        run: |
          python -m pip install --no-index --find-links dist pylmrob
          python -m pip install pytest pytest-cov pytest-randomly pytest-rerunfailures
      - name: Read test-command out of pyproject.toml
        # Read rather than copy. This job used to hardcode its own copy of
        # the command, which silently drifted when #148 added the -m
        # marker, so the job kept passing while the real wheel build
        # broke. Reading the value means the two cannot disagree.
        id: cmd
        shell: python
        run: |
          import os, tomllib
          with open("pyproject.toml", "rb") as fh:
              cmd = tomllib.load(fh)["tool"]["cibuildwheel"]["test-command"]
          cmd = cmd.replace("{project}", os.environ["GITHUB_WORKSPACE"])
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"cmd={cmd}\n")
      - name: Run cibuildwheel's test-command from a foreign working directory
        # This is the whole point of the job. wheels.yml only runs on a v*
        # tag, so nothing exercised the wheel until release time, and the
        # v0.5.25 and v0.5.26 publishes both failed on a test that read a
        # data file through a cwd-relative path. Running from the runner
        # temp dir means a relative path cannot accidentally resolve.
        working-directory: ${{ runner.temp }}
        shell: ${{ matrix.shell }}
        run: ${{ steps.cmd.outputs.cmd }}

  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      # ------------------------------------------------------------------
      # R + robustbase. We only run rpy2-backed tests on Linux to keep CI
      # cheap; correctness against the JSON references is platform-agnostic.
      # ------------------------------------------------------------------
      - name: Install R (Linux)
        if: runner.os == 'Linux'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true

      - name: Cache R packages (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ runner.os }}-robustbase-${{ hashFiles('scripts/generate_r_reference.R') }}

      - name: Install robustbase (Linux)
        if: runner.os == 'Linux'
        run: Rscript -e 'install.packages(c("robustbase","jsonlite"), repos="https://cloud.r-project.org")'

      - name: Install OpenMP runtime (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "LDFLAGS=-L$(brew --prefix libomp)/lib"   >> $GITHUB_ENV
          echo "CPPFLAGS=-I$(brew --prefix libomp)/include" >> $GITHUB_ENV

      - name: Install build deps + project (no rpy2)
        # Non-editable install: lets meson-python's build-isolation handle
        # Cython/meson/ninja without us tracking them. Editable mode would
        # require keeping the build env around for the rebuild-on-import
        # loop, which is more brittle on CI.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v ".[dev]"

      # rpy2 is only needed for the live R-bridge tests, which we skip on
      # macOS/Windows. Installing it elsewhere fails because the build
      # requires R to be on PATH.
      - name: Install rpy2 (Linux only)
        if: runner.os == 'Linux'
        run: python -m pip install ".[validation]"

      - name: Generate R reference (Linux only)
        if: runner.os == 'Linux'
        run: Rscript scripts/generate_r_reference.R

      - name: Run pytest
        env:
          PYROBUSTLM_SKIP_RPY2: ${{ runner.os != 'Linux' && '1' || '' }}
        run: pytest -v --maxfail=10 --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        # Linux-only: Codecov merges per-OS uploads, but uploading from
        # 12 matrix jobs (3 OS x 4 py) just to land at the same number
        # adds noise without coverage signal. Linux runs the full rpy2
        # validation suite so its coverage is also the most complete.
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          flags: ${{ matrix.python-version }}

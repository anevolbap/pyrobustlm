name: Build wheels

# Auto-publishes to PyPI when a ``v*`` tag is pushed (the publish job's
# ``if:`` includes that condition). ``workflow_dispatch`` is kept for
# ad-hoc TestPyPI runs and for re-publishing if a tag's release ever
# needs a redo.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target (workflow_dispatch only)"
        required: true
        default: "testpypi"
        type: choice
        options:
          - testpypi
          - pypi
          - none

jobs:
  build_wheels:
    name: ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-latest
            arch: aarch64
          # macos-13 (Intel) dropped: the free runner queue is unusable
          # in 2026 (5+ hour waits) as GitHub winds down Intel mac
          # capacity. Apple Silicon covers all Macs sold since late
          # 2020; Intel users can install from the sdist.
          - os: macos-14           # Apple Silicon runner
            arch: arm64
          - os: windows-latest
            arch: AMD64
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (linux aarch64)
        if: matrix.os == 'ubuntu-latest' && matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip build
          python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_testpypi:
    name: Publish to TestPyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: inputs.target == 'testpypi'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/pylmrob
    permissions:
      id-token: write   # OIDC trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: inputs.target == 'pypi' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/pylmrob
    permissions:
      id-token: write   # OIDC trusted publisher
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

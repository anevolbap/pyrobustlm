name: CHANGELOG check

# Fails a PR if CHANGELOG.md isn't touched (under the [Unreleased]
# section, usually). Auto-skipped for:
#   - PRs whose title starts with ``chore(`` or ``docs(``
#     (chores, dependabot version bumps, doc-only PRs).
#   - PRs opened by ``dependabot[bot]``.
# Manual escape hatches:
#   - Apply the ``skip-changelog`` label to the PR.
#   - Open the PR with ``[skip changelog]`` in the title.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  changelog:
    name: CHANGELOG touched?
    runs-on: ubuntu-latest
    if: |
      !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
      && !contains(github.event.pull_request.title, '[skip changelog]')
      && !startsWith(github.event.pull_request.title, 'chore(')
      && !startsWith(github.event.pull_request.title, 'docs(')
      && github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Diff against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" HEAD | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated ✓"
          else
            echo "::error::CHANGELOG.md was not updated in this PR."
            echo "Add an entry under '## [Unreleased]', or add the 'skip-changelog' label"
            echo "or put '[skip changelog]' in the PR title for doc-only / pure chore PRs."
            exit 1
          fi
